# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *override* this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/settings.html#gradle.properties

# Specifies the JVM memory used by the daemon.
# The system default is free heap up to 2048 MB or 1/4 of physical memory, whichever is smaller.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure to make it clearer which packages are third party additions
# not included in the standard Android framework package
android.useAndroidX=true

# Enables transitive dependency management
android.enableR8.fullMode=true
